<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexra.ai - AI Tutor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface-2: #f0f2f8;
      --text: #1d2233;
      --muted: #6b7286;
      --border: #e2e5ef;
      --accent: #5b5bd6;
      --accent-text: #ffffff;
      --user-bubble: #5b5bd6;
      --user-text: #ffffff;
      --danger: #d64545;
      --ok: #2f9e66;
      --code-bg: #eef0f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11131a;
        --surface: #1a1d27;
        --surface-2: #232736;
        --text: #e7e9f2;
        --muted: #9aa0b5;
        --border: #2d3244;
        --accent: #8b8bff;
        --accent-text: #0e0f16;
        --user-bubble: #4848b8;
        --user-text: #ffffff;
        --danger: #ff7070;
        --ok: #4fd18f;
        --code-bg: #262a3a;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand { font-weight: 700; font-size: 20px; margin-right: auto; }
    .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--danger); }

    select, button, input, textarea { font: inherit; color: inherit; }

    select, input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
    .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 600; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    #settings {
      display: none;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #settings.open { display: flex; }
    #settings input { flex: 1; min-width: 200px; }
    #settings p { width: 100%; margin: 0; font-size: 12px; color: var(--muted); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }

    .chat { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .welcome { text-align: center; color: var(--muted); margin-top: 8vh; }
    .welcome h2 { color: var(--text); margin-bottom: 6px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .suggestions .btn { font-size: 14px; }

    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }

    .bubble {
      max-width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .msg.user .bubble {
      background: var(--user-bubble); color: var(--user-text);
      border-bottom-right-radius: 4px; white-space: pre-wrap; max-width: 85%;
    }
    .msg.bot .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-bottom-left-radius: 4px; width: 100%;
    }

    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
    .bubble code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: .92em; }
    .bubble pre code { padding: 0; background: none; }
    .bubble table { border-collapse: collapse; display: block; overflow-x: auto; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .katex-display { overflow-x: auto; overflow-y: hidden; }

    .meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .meta button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; }
    .error { color: var(--danger); }

    .cursor::after { content: "▌"; animation: blink 1s steps(1) infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
    .thinking { color: var(--muted); font-style: italic; }

    footer {
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 200px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
    }
    .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .hint { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

    @media (max-width: 560px) {
      .brand small { display: none; }
      header { gap: 8px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">✨ Nexra.ai <small>Your intelligent school tutor</small></div>
    <span class="status-pill"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></span>
    <select id="studentClass" aria-label="Student class"></select>
    <button class="btn" id="newChatBtn" title="Start a new conversation">New chat</button>
    <button class="btn" id="settingsBtn" title="Server settings" aria-label="Settings">⚙</button>
  </header>

  <div id="settings">
    <input type="text" id="serverUrl" placeholder="https://xxxx.trycloudflare.com" aria-label="Server URL" />
    <button class="btn primary" id="saveServerBtn">Save</button>
    <p>Backend URL. Leave empty when this page is opened from the backend itself (e.g. the Colab tunnel link).</p>
  </div>

  <main id="scroller">
    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h2>Hi! What do you want to learn today?</h2>
        <div>Pick your class above and ask any question.</div>
        <div class="suggestions">
          <button class="btn suggestion">What is photosynthesis?</button>
          <button class="btn suggestion">Explain Newton's second law with an example</button>
          <button class="btn suggestion">Solve: 2x + 5 = 17</button>
          <button class="btn suggestion">Why is the sky blue?</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="question" rows="1" placeholder="Ask your question…" maxlength="4000"></textarea>
      <button class="btn primary" id="sendBtn">Ask</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const store = {
      get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch { } },
    };

    // ---------- State ----------
    let userId = store.get("nexra.userId", null);
    if (!userId) { userId = "user_" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("nexra.userId", userId); }
    let controller = null;

    function apiBase() {
      const saved = store.get("nexra.serverUrl", "").trim().replace(/\/+$/, "");
      if (saved) return saved;
      if (location.protocol.startsWith("http")) return location.origin;
      return "http://127.0.0.1:8001";
    }

    // ---------- Class selector ----------
    const classSelect = $("studentClass");
    for (let c = 12; c >= 1; c--) classSelect.add(new Option("Class " + c, c));
    classSelect.value = store.get("nexra.class", "8");
    classSelect.addEventListener("change", () => store.set("nexra.class", classSelect.value));

    // ---------- Settings ----------
    $("serverUrl").value = store.get("nexra.serverUrl", "");
    $("settingsBtn").onclick = () => $("settings").classList.toggle("open");
    $("saveServerBtn").onclick = () => {
      store.set("nexra.serverUrl", $("serverUrl").value.trim());
      $("settings").classList.remove("open");
      checkHealth();
    };

    // ---------- Health ----------
    async function checkHealth() {
      const dot = $("statusDot"), text = $("statusText");
      try {
        const res = await fetch(apiBase() + "/health", { cache: "no-store" });
        const h = await res.json();
        if (h.ready) { dot.className = "dot ok"; text.textContent = h.busy ? "Busy" : "Online"; }
        else if (h.error) { dot.className = "dot bad"; text.textContent = "Model error"; text.title = h.error; }
        else { dot.className = "dot"; text.textContent = "Model loading…"; }
        return h.ready;
      } catch {
        dot.className = "dot bad"; text.textContent = "Offline";
        return false;
      }
    }
    checkHealth();
    setInterval(checkHealth, 15000);

    // ---------- Rendering ----------
    function renderMarkdown(el, text) {
      if (window.marked && window.DOMPurify) {
        // Protect LaTeX from Markdown so underscores / backslashes survive.
        const maths = [];
        const guarded = text.replace(/(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$)/g, (m) => {
          maths.push(m); return "@@MATH" + (maths.length - 1) + "@@";
        });
        let html = DOMPurify.sanitize(marked.parse(guarded, { breaks: true }));
        html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(maths[+i]));
        el.innerHTML = html;
        if (window.renderMathInElement) {
          renderMathInElement(el, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\[", right: "\\]", display: true },
              { left: "\\(", right: "\\)", display: false },
              { left: "$", right: "$", display: false },
            ],
            throwOnError: false,
          });
        }
      } else {
        el.textContent = text;
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function addMessage(role, text) {
      $("welcome")?.remove();
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      $("chat").appendChild(wrap);
      scrollToBottom(true);
      return bubble;
    }

    function nearBottom() {
      const s = $("scroller");
      return s.scrollHeight - s.scrollTop - s.clientHeight < 120;
    }
    function scrollToBottom(force) {
      const s = $("scroller");
      if (force || nearBottom()) s.scrollTop = s.scrollHeight;
    }

    function addMeta(bubble, answer, info) {
      const meta = document.createElement("div");
      meta.className = "meta";
      if (info) meta.append(info + " ·");
      const copy = document.createElement("button");
      copy.textContent = "Copy";
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(answer); copy.textContent = "Copied!"; }
        catch { copy.textContent = "Copy failed"; }
        setTimeout(() => (copy.textContent = "Copy"), 1500);
      };
      meta.appendChild(copy);
      bubble.appendChild(meta);
    }

    // ---------- Asking ----------
    function setBusy(busy) {
      const btn = $("sendBtn");
      btn.textContent = busy ? "Stop" : "Ask";
      btn.className = busy ? "btn danger" : "btn primary";
    }

    async function ask(question) {
      if (controller) return;
      question = question.trim();
      if (!question) return;

      addMessage("user", question);
      const bubble = addMessage("bot", "");
      bubble.innerHTML = '<span class="thinking">Thinking…</span>';

      controller = new AbortController();
      setBusy(true);

      let answer = "";
      let pending = false;
      const paint = (final) => {
        renderMarkdown(bubble, answer);
        bubble.classList.toggle("cursor", !final);
        scrollToBottom(false);
      };
      const schedulePaint = () => {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => { pending = false; if (controller) paint(false); });
      };

      try {
        const res = await fetch(apiBase() + "/ask/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, studentClass: parseInt(classSelect.value, 10), text: question }),
          signal: controller.signal,
        });
        if (!res.ok) {
          let detail = "Server error " + res.status;
          try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : (j.detail?.[0]?.msg || detail); } catch { }
          throw new Error(detail);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let done = null;

        while (true) {
          const { value, done: streamDone } = await reader.read();
          if (streamDone) break;
          buffer += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            const raw = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);
            const line = raw.split("\n").find((l) => l.startsWith("data:"));
            if (!line) continue;
            const event = JSON.parse(line.slice(5).trim());
            if (event.token) { answer += event.token; schedulePaint(); }
            else if (event.error) throw new Error(event.error);
            else if (event.done) done = event;
          }
        }

        controller = null;
        if (done) answer = done.answer;
        paint(true);
        let info = done ? done.seconds + "s" : "";
        if (done?.stopReason === "length") info += " · reached length limit, ask \"continue\" for more";
        addMeta(bubble, answer, info);
      } catch (err) {
        const aborted = err.name === "AbortError";
        controller = null;
        if (answer) paint(true); else bubble.innerHTML = "";
        bubble.classList.remove("cursor");
        const note = document.createElement("div");
        note.className = aborted ? "meta" : "meta error";
        note.textContent = aborted ? "Stopped." :
          "⚠ " + (err.message === "Failed to fetch" ? "Could not reach the Nexra.ai server. Check the server URL in ⚙ settings." : err.message);
        bubble.appendChild(note);
        if (!aborted) checkHealth();
      } finally {
        controller = null;
        setBusy(false);
        $("question").focus();
      }
    }

    // ---------- Wiring ----------
    const input = $("question");
    function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }
    input.addEventListener("input", autoGrow);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    });

    function send() {
      if (controller) { controller.abort(); return; }
      const q = input.value;
      if (!q.trim()) return;
      input.value = "";
      autoGrow();
      ask(q);
    }
    $("sendBtn").onclick = send;

    document.querySelectorAll(".suggestion").forEach((b) => (b.onclick = () => ask(b.textContent)));

    $("newChatBtn").onclick = async () => {
      if (controller) controller.abort();
      try { await fetch(apiBase() + "/history/" + encodeURIComponent(userId), { method: "DELETE" }); } catch { }
      location.reload();
    };

    input.focus();
  </script>
</body>

</html>
